; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; The scale UI is compiled into the firmware (no uploadfs step needed) —
; an OTA firmware update therefore also updates the web page.
board_build.embed_txtfiles = web/index.html
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-DCORE_DEBUG_LEVEL=2
	; Serial log over the native "USB" port (the one the board is plugged into)
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
